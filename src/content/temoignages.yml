intro: Les témoignages proviennent directement des avis laissés sur la fiche
  Google Business Profile de Sourcier Québec.
temoignages:
  - auteur: Client résidentiel
    texte: Travail sérieux et méthodique. Le point de forage suggéré s'est avéré
      exact — débit au rendez-vous.
  - auteur: Exploitation agricole
    texte: "Grâce à Thomas, nous avons évité un forage à sec et le débit était
      répondait à nos attentes pour l'irrigation de notre pépinière. "
  - auteur: Projet Résidentiel
    texte: Excellent travail avec minutie et soucis du détail! Je recommande
      fortement!
